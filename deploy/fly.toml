# Fly.io configuration. Run `fly launch --copy-config` for first deploy,
# then `fly scale count 2 --region iad,fra` for multi-region HA.
app = "echoes-of-choice"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_FORMAT = "json"

# Secrets are set with `fly secrets set GEMINI_API_KEY=... STRIPE_SECRET_KEY=...`

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2          # always at least 2 machines, multi-region
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
